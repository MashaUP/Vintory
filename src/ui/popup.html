<!doctype html>
<html lang="it">
<head>

  <title>Vintory</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <img src="../../icons/icon48.png" alt="" width="28" height="28">
    <div class="grow">
      <h1>Vintory</h1>
      <div class="muted small" id="version"></div>
    </div>
